# Solipsist — macOS app wrapping the Boris content compiler.
#
# This project is generated with XcodeGen (see Makefile). Do not hand-edit
# the generated Solipsist.xcodeproj — edit this spec and run `make generate`.

name: Solipsist
options:
  bundleIdPrefix: dev.drawmeanelephant
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    # Local dev builds: ad-hoc sign to run locally (no team required).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    GITHUB_OAUTH_CLIENT_ID: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Solipsist:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Chrome
      - path: Sources/Workspace
      - path: Sources/Play
      - path: Sources/Inspector
      - path: Sources/Companions
      - path: Sources/Compose
      - path: Sources/Intents
      - path: Sources/Models
      - path: Sources/Engine
      - path: Sources/Security
      - path: Solipsist/Assets.xcassets
      - path: docs/help.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.solipsist
        PRODUCT_NAME: Solipsist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Solipsist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # GitHub device-flow OAuth client id (M15). Public by design;
        # an operator registers the OAuth App and injects the id here.
        # Empty = the sheet offers the token (PAT) path only.
        INFOPLIST_KEY_GithubOAuthClientID: "$(GITHUB_OAUTH_CLIENT_ID)"
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 draw me an elephant"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    entitlements:
      path: Solipsist/Solipsist.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # WKWebView previews load the local boris serve (loopback only).
        com.apple.security.network.client: true
        # `boris watch --serve` (spawned by the app) binds a loopback port.
        com.apple.security.network.server: true
        # NOTE: FoundationModels drafting (M18) runs without extra
        # entitlements locally (probed: availability == .available under
        # ad-hoc signing). App Store distribution will need
        # com.apple.developer.foundation-model-access + provisioning —
        # #110 territory.
    preBuildScripts:
      - name: Embed Boris engine binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          /bin/bash "${SRCROOT}/scripts/embed-boris.sh" "${SRCROOT}" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"

  # M1 engine spike: a headless CLI that runs the bundled boris binary and
  # decodes its JSON contracts. Shares Sources/Models, Sources/Engine, and
  # Sources/Security (stdin secret buffers) with the app.
  spike:
    type: tool
    platform: macOS
    # CI hosts may run macOS 26; the spike harness uses nothing newer.
    # Only the shipped app requires 27.
    deploymentTarget:
      macOS: "26.0"
    sources:
      - path: Sources/Models
      - path: Sources/Engine
      - path: Sources/Security
      - path: Sources/Companions/Editor/EditorURL.swift
      - path: Spike
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_NAME: boris-spike
        GENERATE_INFOPLIST_FILE: YES

  ContractTests:
    type: bundle.unit-test
    platform: macOS
    # Host-agnostic like spike: every API these tests touch is ≤26
    # (FoundationModels included). The 27-only surface (supportedModes)
    # lives in the app target only.
    deploymentTarget:
      macOS: "26.0"
    sources:
      - path: Tests/ContractTests
      - path: Tests/Fixtures
        type: folder
      - path: Sources/Models
      - path: Sources/Security
      - path: Sources/Engine
      - path: Sources/Inspector
      - path: Sources/Play/Local/LocalPlayGraph.swift
      - path: Sources/Play/Local/LetterReloadClient.swift
      - path: Sources/App/CoordinatorActivity.swift
      - path: Sources/Play/Local/ProblemResolver.swift
      - path: Sources/App/CoordinatorProblems.swift
      - path: Sources/App/CoordinatorPolicy.swift
      - path: Sources/App/SaveValidateGate.swift
      - path: Sources/Workspace/Source.swift
      - path: Sources/Workspace/SidebarExpansionState.swift
      - path: Sources/Workspace/SidebarNavigation.swift
      - path: Sources/Workspace/WorkspacePersistence.swift
      - path: Sources/Workspace/WorkspaceSelection.swift
      - path: Sources/Workspace/Local/LocalSource.swift
      - path: Sources/Workspace/Git
      - path: Sources/Workspace/GitHub
      - path: Sources/Companions/CompanionID.swift
      - path: Sources/Companions/Editor/EditorURL.swift
      - path: Sources/Companions/Editor/EditorSession.swift
      - path: Sources/Companions/Editor/EditorCopy.swift
      - path: Sources/Companions/Editor/EditorServerFactory.swift
      - path: Sources/Companions/Preview/PreviewURL.swift
      - path: Sources/Compose/ComposeLanguage.swift
      - path: Sources/Compose/ComposeDocument.swift
      - path: Sources/Compose/ComposeSaveFlow.swift
      - path: Sources/Compose/ComposeHighlighter.swift
      - path: Sources/Compose/ComposeDiagnostic.swift
      - path: Sources/Compose/ComposeFrontmatter.swift
      - path: Sources/Compose/ComposeCookCompletion.swift
      - path: Sources/Compose/MarkupRenderService.swift
      - path: Sources/Compose/ComposePageResolver.swift
      - path: Sources/Compose/OliverRenderService.swift
      - path: Sources/Compose/ComposePreviewDocument.swift
      - path: Sources/Compose/ComposeThemeCSS.swift
      - path: Sources/Compose/ComposeWebPreviewHost.swift
      - path: Sources/Compose/ComposeLineGutter.swift
      - path: Sources/Compose/ComposeTabIndent.swift
      - path: Sources/Compose/ComposeTextView.swift
      - path: Sources/Compose/ComposeTextCoordinator.swift
      - path: Sources/Compose/ComposeFormat.swift
      - path: Sources/Compose/ComposeStagedDraft.swift
      - path: Sources/Intents/StagedPostDraft.swift
      - path: Sources/Intents/DraftRouter.swift
      - path: Sources/Intents/PostDraftEngine.swift
      - path: Sources/Compose/ComposeFormatToolbar.swift
      - path: Sources/Compose/ComposeTypography.swift
      - path: Sources/Compose/ComposeBlockMap.swift
      - path: Sources/Compose/ComposeMarkupOp.swift
      - path: Sources/Compose/ComposeVisualDocument.swift
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.solipsist.contracttests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: ContractTests

schemes:
  Solipsist:
    build:
      targets:
        Solipsist: all
    run:
      config: Debug
  spike:
    build:
      targets:
        spike: all
    run:
      config: Debug
  ContractTests:
    build:
      targets:
        ContractTests: [test, run]
    test:
      targets:
        - ContractTests
